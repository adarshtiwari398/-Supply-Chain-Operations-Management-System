<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title description">
  <title id="title">Supply Chain Operations Executive Dashboard</title>
  <desc id="description">Illustrative November 2026 snapshot showing procurement, inventory, supplier delivery, purchase orders, and inbound exceptions.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102a36"/>
      <stop offset="1" stop-color="#1b4653"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#173844" flood-opacity=".07"/>
    </filter>
  </defs>
  <style>
    text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
    .label { fill: #71858e; font-size: 13px; font-weight: 700; letter-spacing: 1.15px; }
    .body { fill: #526a74; font-size: 15px; }
    .small { fill: #71858e; font-size: 13px; }
  </style>

  <rect width="1440" height="760" fill="#f3f6f7"/>
  <rect width="1440" height="80" fill="url(#header)"/>
  <rect x="36" y="20" width="40" height="40" rx="12" fill="#1e6b6b"/>
  <path d="M46 48h20M50 42l6-9 7 9M56 33v15" fill="none" stroke="#e7f5f2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="56" cy="50" r="3" fill="#d9a86c"/>
  <text x="91" y="38" fill="#f5faf9" font-size="18" font-weight="700" letter-spacing=".6">SUPPLY CHAIN OPERATIONS</text>
  <text x="91" y="59" fill="#b5c9cc" font-size="12">PROCUREMENT · INVENTORY · LOGISTICS · CONTROL</text>
  <rect x="1192" y="24" width="212" height="32" rx="16" fill="#ffffff" fill-opacity=".12"/>
  <circle cx="1211" cy="40" r="4" fill="#7bd0ad"/>
  <text x="1223" y="45" fill="#eef6f5" font-size="12" font-weight="700" letter-spacing=".8">EXECUTIVE DASHBOARD</text>

  <text x="36" y="111" fill="#173844" font-size="22" font-weight="700">Executive operating position</text>
  <text x="1404" y="109" text-anchor="end" fill="#71858e" font-size="13" font-weight="600">NOV 2026  ·  ILLUSTRATIVE SAMPLE DATA</text>

  <g filter="url(#shadow)">
    <rect x="36" y="130" width="262" height="126" rx="12" fill="#fff"/>
    <rect x="36" y="130" width="262" height="4" rx="2" fill="#2f7892"/>
    <rect x="314" y="130" width="262" height="126" rx="12" fill="#fff"/>
    <rect x="314" y="130" width="262" height="4" rx="2" fill="#1e8a79"/>
    <rect x="592" y="130" width="262" height="126" rx="12" fill="#fff"/>
    <rect x="592" y="130" width="262" height="4" rx="2" fill="#d3a85e"/>
    <rect x="870" y="130" width="262" height="126" rx="12" fill="#fff"/>
    <rect x="870" y="130" width="262" height="4" rx="2" fill="#5579a8"/>
    <rect x="1148" y="130" width="256" height="126" rx="12" fill="#fff"/>
    <rect x="1148" y="130" width="256" height="4" rx="2" fill="#438d78"/>
  </g>
  <text class="label" x="56" y="163">ACTUAL SPEND</text>
  <text x="56" y="205" fill="#173844" font-size="30" font-weight="700">$1,178</text>
  <text class="small" x="56" y="232">Received orders · November</text>
  <text class="label" x="334" y="163">BUDGET USED</text>
  <text x="334" y="205" fill="#173844" font-size="30" font-weight="700">20.2%</text>
  <text class="small" x="334" y="232">Planned spend against $50,000</text>
  <text class="label" x="612" y="163">INVENTORY VALUE</text>
  <text x="612" y="205" fill="#173844" font-size="30" font-weight="700">$13,731</text>
  <text class="small" x="612" y="232">On-hand stock at unit cost</text>
  <text class="label" x="890" y="163">OPEN PURCHASE ORDERS</text>
  <text x="890" y="205" fill="#173844" font-size="30" font-weight="700">6</text>
  <text class="small" x="890" y="232">Pending or approved, not received</text>
  <text class="label" x="1168" y="163">SUPPLIER ON-TIME</text>
  <text x="1168" y="205" fill="#173844" font-size="30" font-weight="700">72.2%</text>
  <text class="small" x="1168" y="232">13 of 18 recorded deliveries</text>

  <g filter="url(#shadow)">
    <rect x="36" y="276" width="842" height="438" rx="14" fill="#fff"/>
    <rect x="896" y="276" width="508" height="438" rx="14" fill="#fff"/>
  </g>

  <text x="64" y="315" fill="#173844" font-size="17" font-weight="700">Procurement control</text>
  <text x="64" y="340" class="small">Monthly budget allocation and committed spend</text>
  <text x="64" y="382" class="label">PLANNED EXPENDITURE</text>
  <text x="850" y="382" text-anchor="end" fill="#173844" font-size="20" font-weight="700">$10,091</text>
  <text x="64" y="410" class="small">0</text>
  <text x="850" y="410" text-anchor="end" class="small">$50,000 BUDGET</text>
  <rect x="64" y="422" width="786" height="16" rx="8" fill="#e9eff1"/>
  <path d="M72 422h10v16H72a8 8 0 0 1-8-8 8 8 0 0 1 8-8" fill="#2f7892"/>
  <rect x="82" y="422" width="140" height="16" fill="#1e8a79"/>
  <circle cx="222" cy="430" r="8" fill="#1e8a79"/>
  <rect x="64" y="460" width="10" height="10" rx="3" fill="#2f7892"/>
  <text x="82" y="469" class="body">Actual expenditure</text>
  <text x="282" y="469" fill="#173844" font-size="14" font-weight="700">$1,178</text>
  <rect x="390" y="460" width="10" height="10" rx="3" fill="#1e8a79"/>
  <text x="408" y="469" class="body">Approved commitments</text>
  <text x="615" y="469" fill="#173844" font-size="14" font-weight="700">$8,913</text>
  <text x="850" y="469" text-anchor="end" fill="#1e8a79" font-size="13" font-weight="700">20.2% OF BUDGET</text>

  <line x1="64" y1="497" x2="850" y2="497" stroke="#e8eef0"/>
  <text x="64" y="531" fill="#173844" font-size="17" font-weight="700">Purchase order pipeline</text>
  <text x="850" y="531" text-anchor="end" class="small">7 total orders</text>
  <rect x="64" y="550" width="112" height="18" rx="7" fill="#d5a654"/>
  <rect x="176" y="550" width="560" height="18" fill="#2f7892"/>
  <rect x="736" y="550" width="114" height="18" rx="7" fill="#1e8a79"/>
  <circle cx="69" cy="604" r="5" fill="#d5a654"/>
  <text x="82" y="609" class="body">Pending</text>
  <text x="158" y="609" fill="#173844" font-size="14" font-weight="700">1</text>
  <circle cx="250" cy="604" r="5" fill="#2f7892"/>
  <text x="263" y="609" class="body">Approved</text>
  <text x="349" y="609" fill="#173844" font-size="14" font-weight="700">5</text>
  <circle cx="443" cy="604" r="5" fill="#1e8a79"/>
  <text x="456" y="609" class="body">Completed</text>
  <text x="553" y="609" fill="#173844" font-size="14" font-weight="700">1</text>

  <rect x="64" y="644" width="786" height="42" rx="9" fill="#fff7eb"/>
  <circle cx="84" cy="665" r="6" fill="#d5913e"/>
  <text x="101" y="670" fill="#76552d" font-size="14" font-weight="600">Inbound attention</text>
  <text x="262" y="670" fill="#76552d" font-size="14">3 delayed shipments need follow-up</text>
  <text x="828" y="670" text-anchor="end" fill="#76552d" font-size="13" font-weight="700">2 APPROVALS WAITING</text>

  <text x="924" y="315" fill="#173844" font-size="17" font-weight="700">Supplier &amp; inventory health</text>
  <text x="924" y="340" class="small">Signals to guide the next operating review</text>
  <text x="924" y="385" class="label">ON-TIME DELIVERY</text>
  <text x="1376" y="385" text-anchor="end" fill="#173844" font-size="16" font-weight="700">72.2%</text>
  <rect x="924" y="400" width="452" height="12" rx="6" fill="#e9eff1"/>
  <rect x="924" y="400" width="326" height="12" rx="6" fill="#1e8a79"/>
  <text x="924" y="436" class="small">13 on time</text>
  <text x="1376" y="436" text-anchor="end" class="small">18 delivered shipments assessed</text>

  <line x1="924" y1="460" x2="1376" y2="460" stroke="#e8eef0"/>
  <text x="924" y="496" class="label">CURRENT STOCK POSITION</text>
  <text x="924" y="536" fill="#173844" font-size="25" font-weight="700">$13,731</text>
  <text x="924" y="559" class="small">On-hand inventory value</text>
  <rect x="924" y="581" width="452" height="1" fill="#e8eef0"/>
  <text x="924" y="615" class="body">Catalog items</text>
  <text x="1376" y="615" text-anchor="end" fill="#173844" font-size="15" font-weight="700">20</text>
  <text x="924" y="647" class="body">Open delayed inbound</text>
  <text x="1376" y="647" text-anchor="end" fill="#b8752e" font-size="15" font-weight="700">3</text>
  <text x="924" y="679" class="body">Pending approvals</text>
  <text x="1376" y="679" text-anchor="end" fill="#173844" font-size="15" font-weight="700">2</text>

  <text x="36" y="741" fill="#83949b" font-size="12">Static README preview · illustrative bundled records · the running app calculates live values from its local database</text>
  <text x="1404" y="741" text-anchor="end" fill="#83949b" font-size="12">SUPPLY CHAIN CONTROL</text>
</svg>
